version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: master
    assignees:
      - hendisantika
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework*"
      maven-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions (.github/workflows)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: master
    assignees:
      - hendisantika
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker base images (Dockerfile)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: master
    assignees:
      - hendisantika
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build"
      include: scope
    ignore:
      # Stay on the JDK 25 LTS line (amazoncorretto:25-*); only accept patch/minor image updates
      - dependency-name: "amazoncorretto"
        update-types: [ "version-update:semver-major" ]
